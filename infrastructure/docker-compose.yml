services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idcall
      POSTGRES_USER: idcall
      POSTGRES_PASSWORD: idcall
    ports:
      - "5432:5432"
    volumes:
      - idcall-postgres:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./database/002_reporter_abuse_controls.sql:/docker-entrypoint-initdb.d/002_reporter_abuse_controls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idcall -d idcall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  idcall-postgres:
